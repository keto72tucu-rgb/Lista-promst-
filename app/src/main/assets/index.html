<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JA Prompts</title><style>:root{--bg:#050a12;--panel:#0b1320;--line:#17496e;--blue:#25a7ff;--cyan:#48e8ff;--txt:#f4f8ff;--muted:#8fa8c0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% -10%,#0d3a73 0,#071426 33%,#040810 68%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:70px}.hero{text-align:center;padding:22px 16px 10px}.logo{width:108px;height:108px;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#0d2c55,#050a12 65%);border:3px solid #25a7ff;box-shadow:0 0 35px #159cff88, inset 0 0 20px #493cff55;font-size:41px;font-weight:900;letter-spacing:-4px;color:#eaf4ff;text-shadow:0 0 10px #33caff}.logo span{background:linear-gradient(180deg,#fff,#9fb6d0);-webkit-background-clip:text;color:transparent}.hero h1{margin:10px 0 3px;font-size:25px}.hero p{margin:0;color:#8fd7ff;font-size:13px}.wrap{max-width:760px;margin:auto;padding:0 14px}.card{background:linear-gradient(180deg,#0b1625f2,#07101cf2);border:1px solid #16446e;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 12px 32px #0008}.row{display:flex;gap:10px}.row>*{flex:1}label{font-size:12px;color:#9bb6cd;display:block;margin:2px 0 6px}input,textarea{width:100%;border-radius:13px;border:1px solid #1b4d77;background:#07101b;color:white;padding:13px;font-size:15px;outline:none}textarea{min-height:145px;resize:vertical}.btn{border:0;border-radius:13px;padding:12px 14px;font-size:14px;font-weight:750;color:white;background:#14263b;box-shadow:inset 0 0 0 1px #28547d}.primary{background:linear-gradient(135deg,#117cf1,#17cae7);box-shadow:none}.danger{background:#35151d;color:#ffdce2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:16px;margin:0}.counter,.small{font-size:12px;color:#7892aa}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 0}.chip{white-space:nowrap;border:1px solid #1b456a;border-radius:999px;padding:8px 11px;background:#0a1624;color:#bdd5eb;font-size:12px}.chip.on{background:#0f5b98;color:white;border-color:#28aaf6}.prompt{border:1px solid #163b5e;border-radius:16px;background:#07111d;margin:10px 0;padding:14px}.ptop{display:flex;justify-content:space-between;gap:8px}.ptitle{font-weight:800}.badge{display:inline-block;margin-top:6px;font-size:11px;padding:5px 9px;border-radius:999px;background:#0b2e4d;color:#88ddff;border:1px solid #155681}.ptext{white-space:pre-wrap;color:#dceafb;line-height:1.45;margin:12px 0;max-height:150px;overflow:auto}.empty{text-align:center;color:#7892aa;padding:35px 10px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#13283e;border:1px solid #2475ac;border-radius:999px;padding:10px 16px;font-size:13px;display:none;z-index:20}@media(max-width:520px){.row{flex-direction:column}.logo{width:94px;height:94px;font-size:36px}}</style></head><body><div class="hero"><div class="logo"><span>JA</span></div><h1>JA Prompts</h1><p>J.A Inteligencia Artificial · Biblioteca personal</p></div><div class="wrap"><section class="card"><div class="section"><h2 id="formTitle">➕ Guardar nuevo prompt</h2></div><div class="row"><div><label>Título</label><input id="title" placeholder="Ej.: Retrato cinematográfico"></div><div><label>Categoría</label><input id="category" list="cats" placeholder="Imagen, video, ChatGPT..."><datalist id="cats"><option value="Imagen"><option value="Video"><option value="ChatGPT"><option value="Fotografía"><option value="Redes"><option value="Trabajo"><option value="Otros"></datalist></div></div><div style="margin-top:10px"><label>Prompt</label><textarea id="prompt" placeholder="Pegá o escribí acá tu prompt..."></textarea></div><div class="actions"><button class="btn primary" id="save">💾 Guardar</button><button class="btn" id="cancel" style="display:none">Cancelar</button><button class="btn" id="clear">Limpiar</button></div><div class="small" style="margin-top:9px">Tus prompts quedan guardados en este teléfono aunque cierres la app.</div></section><section class="card"><div class="section"><h2>📚 Mis prompts</h2><span class="counter" id="count"></span></div><input id="search" placeholder="🔎 Buscar prompt..."><div class="tabs" id="tabs"></div></section><div id="list"></div></div><div class="toast" id="toast"></div><script>const KEY='ja_prompts_android_v1';let items=[],editId=null,filter='Todos';const $=id=>document.getElementById(id);const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>e.style.display='none',1500)}function load(){try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(items))}function reset(){editId=null;$('title').value='';$('category').value='';$('prompt').value='';$('formTitle').textContent='➕ Guardar nuevo prompt';$('save').textContent='💾 Guardar';$('cancel').style.display='none'}function cats(){return ['Todos','⭐ Favoritos',...[...new Set(items.map(x=>x.category).filter(Boolean))].sort()]}function render(){const q=$('search').value.trim().toLowerCase();$('tabs').innerHTML=cats().map(c=>`<button class="chip ${filter===c?'on':''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join('');let arr=items.filter(x=>(filter==='Todos'||filter==='⭐ Favoritos'&&x.favorite||x.category===filter)&&(!q||(x.title+' '+x.category+' '+x.text).toLowerCase().includes(q))).sort((a,b)=>(b.favorite-a.favorite)||(b.updated-a.updated));$('count').textContent=`${items.length} guardado${items.length===1?'':'s'}`;$('list').innerHTML=arr.length?arr.map(x=>`<article class="prompt"><div class="ptop"><div><div class="ptitle">${esc(x.title||'Sin título')}</div>${x.category?`<span class="badge">${esc(x.category)}</span>`:''}</div><button class="btn" onclick="fav('${x.id}')">${x.favorite?'★':'☆'}</button></div><div class="ptext">${esc(x.text)}</div><div class="actions"><button class="btn primary" onclick="copyP('${x.id}')">📋 Copiar</button><button class="btn" onclick="editP('${x.id}')">✏️ Editar</button><button class="btn danger" onclick="delP('${x.id}')">🗑️ Borrar</button></div></article>`).join(''):'<div class="card empty">No hay prompts para mostrar.</div>'}window.setFilter=c=>{filter=c;render()};$('save').onclick=()=>{let title=$('title').value.trim(),category=$('category').value.trim(),text=$('prompt').value.trim();if(!text){toast('Escribí un prompt primero');return}let t=Date.now();if(editId){let x=items.find(i=>i.id===editId);if(x){x.title=title;x.category=category;x.text=text;x.updated=t}}else items.push({id:String(t)+'_'+Math.random().toString(36).slice(2),title,category,text,favorite:false,created:t,updated:t});persist();reset();render();toast('Guardado ✅')};$('clear').onclick=reset;$('cancel').onclick=reset;$('search').oninput=render;window.copyP=async id=>{let x=items.find(i=>i.id===id);if(!x)return;try{await navigator.clipboard.writeText(x.text);toast('Prompt copiado ✅')}catch(e){let ta=document.createElement('textarea');ta.value=x.text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Prompt copiado ✅')}};window.editP=id=>{let x=items.find(i=>i.id===id);if(!x)return;editId=id;$('title').value=x.title;$('category').value=x.category;$('prompt').value=x.text;$('formTitle').textContent='✏️ Editar prompt';$('save').textContent='💾 Guardar cambios';$('cancel').style.display='inline-block';scrollTo({top:0,behavior:'smooth'})};window.delP=id=>{if(confirm('¿Borrar este prompt?')){items=items.filter(i=>i.id!==id);persist();if(editId===id)reset();render();toast('Borrado')}};window.fav=id=>{let x=items.find(i=>i.id===id);if(x){x.favorite=!x.favorite;x.updated=Date.now();persist();render()}};load();render();</script></body></html>
